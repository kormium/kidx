kotlin.code.style=official
group = io.github.kormium
# The published version comes from the release tag (-Pversion=...); this is what a local build produces.
version = 0.1.0-SNAPSHOT

org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# js + wasmJs share a `webMain` source set, which is where `kotlin.js.JsAny` lives.
kotlin.mpp.applyDefaultHierarchyTemplate=true
